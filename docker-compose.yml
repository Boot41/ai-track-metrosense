services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app_scaffold
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./server
    environment:
      ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/app_scaffold
    ports:
      - "8000:8000"
    depends_on:
      - db

  client:
    build: ./client
    ports:
      - "5173:80"
    depends_on:
      - api
  agents:
    build: ./agents
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-false}
      AGENT_MODEL: ${AGENT_MODEL:-gemini-2.0-flash}
    ports:
      - "8020:8020"

volumes:
  postgres_data:
